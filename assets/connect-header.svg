<svg width="850" height="95" viewBox="0 0 850 95" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes nodeTravel {
      0% { transform: translateX(120px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(730px); opacity: 0; }
    }
    .signal-dot { animation: nodeTravel 3s ease-in-out infinite alternate; }
  </style>

  <defs>
    <linearGradient id="lineGrad" x1="50" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="35%" stop-color="#00FF41" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <text x="425" y="36" text-anchor="middle" fill="#00FF41" font-family="sans-serif" font-size="26" font-weight="bold" letter-spacing="8" filter="url(#neonGlow)">
    CONNECT
  </text>

  <text x="425" y="62" text-anchor="middle" fill="#00E5FF" font-family="monospace" font-size="11" letter-spacing="3.5">
    // ESTABLISHING UPLINK — YUDA (REXXY-4V)
  </text>

  <line x1="60" y1="82" x2="790" y2="82" stroke="url(#lineGrad)" stroke-width="1.5" />
  <circle class="signal-dot" cx="0" cy="82" r="3.5" fill="#00FF41" filter="url(#neonGlow)" />
</svg>