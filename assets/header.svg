<svg width="850" height="48" viewBox="0 0 850 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes eq1 { 0%, 100% { height: 6px; y: 21px; } 50% { height: 18px; y: 15px; } }
    @keyframes eq2 { 0%, 100% { height: 16px; y: 16px; } 50% { height: 5px; y: 21.5px; } }
    @keyframes eq3 { 0%, 100% { height: 9px; y: 19.5px; } 50% { height: 20px; y: 14px; } }
    @keyframes sweepBeam {
      0% { transform: translateX(-250px); }
      100% { transform: translateX(950px); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .bar1 { animation: eq1 0.9s infinite ease-in-out; }
    .bar2 { animation: eq2 0.7s infinite ease-in-out; }
    .bar3 { animation: eq3 1.1s infinite ease-in-out; }
    .sweep { animation: sweepBeam 3.8s infinite linear; }
    .cursor { animation: cursorBlink 1s infinite; }
  </style>

  <defs>
    <clipPath id="chamferClip">
      <polygon points="14,0 836,0 850,14 850,34 836,48 14,48 0,34 0,14" />
    </clipPath>
    <linearGradient id="cyberBeam" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF41" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#chamferClip)">
    <rect width="850" height="48" fill="#080D11" />
    <rect class="sweep" x="0" y="0" width="220" height="48" fill="url(#cyberBeam)" />
  </g>

  <!-- Chamfered Tech Border -->
  <polygon points="14,1 836,1 849,14 849,34 836,47 14,47 1,34 1,14" stroke="#00FF41" stroke-opacity="0.65" stroke-width="1.5" fill="none" />
  
  <!-- Left Accent Tag -->
  <polygon points="14,1 28,1 18,47 14,47 1,34 1,14" fill="#00FF41" fill-opacity="0.18" />
  <circle cx="26" cy="24" r="4" fill="#00FF41" />

  <!-- Terminal Command -->
  <text x="45" y="28" fill="#00FF41" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">
    SYS.EXEC // YUDA_PORTFOLIO_V2.0
  </text>
  <rect class="cursor" x="318" y="16" width="8" height="15" fill="#00FF41" />

  <!-- Live Audio/System Equalizer -->
  <rect class="bar1" x="720" y="18" width="3" height="12" rx="1.5" fill="#00FF41" />
  <rect class="bar2" x="726" y="15" width="3" height="18" rx="1.5" fill="#00E5FF" />
  <rect class="bar3" x="732" y="19" width="3" height="10" rx="1.5" fill="#00FF41" />
  <rect class="bar1" x="738" y="16" width="3" height="16" rx="1.5" fill="#00FF41" />

  <text x="752" y="28" fill="#00FF41" font-family="monospace" font-size="11.5" font-weight="bold" letter-spacing="1">
    ONLINE
  </text>
</svg>